[package]
name = "rg-broadcaster"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Railgun broadcasters: signed fee offers, encrypted transact requests, and a Waku light client to reach them"

[features]
default = []
# Waku light client over libp2p: store queries for fees and responses, light push for requests.
waku = ["dep:hickory-resolver", "dep:k256", "dep:libp2p", "dep:prost", "dep:tiny-keccak", "dep:tokio"]

[dependencies]
ed25519-dalek.workspace = true
hex.workspace = true
rand.workspace = true
rg-keys.workspace = true
rg-primitives.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
zeroize.workspace = true
hickory-resolver = { workspace = true, optional = true }
k256 = { workspace = true, optional = true }
libp2p = { workspace = true, optional = true }
prost = { workspace = true, optional = true }
tiny-keccak = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

[lints]
workspace = true
