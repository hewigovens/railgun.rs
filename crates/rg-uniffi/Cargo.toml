[package]
name = "rg-uniffi"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "UniFFI bindings for the Railgun core"

[features]
default = ["cli"]
cli = ["uniffi/cli"]

[lib]
crate-type = ["lib", "staticlib", "cdylib"]

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["cli"]

[dependencies]
hex.workspace = true
rg-core.workspace = true
rg-keys.workspace = true
rg-sync.workspace = true
thiserror.workspace = true
uniffi.workspace = true

[lints]
workspace = true
