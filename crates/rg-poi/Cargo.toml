[package]
name = "rg-poi"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Private Proof of Innocence: txid tree, blinded commitments, POI circuit inputs and the aggregator client"

[features]
default = []
# Blocking JSON-RPC client for the POI aggregator.
rpc = ["dep:hex", "dep:reqwest", "dep:serde_json"]

[dependencies]
rg-primitives.workspace = true
rg-tree.workspace = true
thiserror.workspace = true
hex = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
hex.workspace = true

[lints]
workspace = true
