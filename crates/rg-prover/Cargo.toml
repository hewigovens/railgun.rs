[package]
name = "rg-prover"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Circom witness from the circuit wasm, snarkjs zkey loading and Groth16 proving with arkworks"

[features]
default = ["wasmi"]
# Interpreter: no JIT, so it also runs where JIT is not allowed (iOS).
wasmi = ["dep:wasmi"]
# Cranelift JIT, for macOS and Android.
wasmtime = ["dep:wasmtime"]
parallel = ["dep:rayon", "ark-groth16/parallel", "ark-ec/parallel", "ark-ff/parallel", "ark-poly/parallel", "ark-std/parallel"]

[dependencies]
ark-bn254 = { workspace = true }
ark-ec = { workspace = true, features = ["std"] }
ark-ff = { workspace = true, features = ["std"] }
ark-groth16 = { workspace = true, features = ["std"] }
ark-poly = { workspace = true, features = ["std"] }
ark-relations = { workspace = true, features = ["std"] }
ark-serialize = { workspace = true, features = ["std"] }
ark-std = { workspace = true, features = ["std"] }
rand.workspace = true
rayon = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
wasmi = { workspace = true, optional = true }
wasmtime = { workspace = true, optional = true }

[dev-dependencies]
hex.workspace = true

[lints]
workspace = true
