[workspace]
resolver = "2"
members = ["crates/rg-primitives", "crates/rg-keys"]

[workspace.package]
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
ark-bn254 = { version = "0.5", default-features = false, features = ["curve"] }
ark-ff = { version = "0.5", default-features = false }
bech32 = "0.11"
bip39 = { version = "2", features = ["unicode-normalization"] }
blake-hash = "0.4"
ed25519-dalek = "2"
hex = "0.4"
hmac = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
rg-primitives = { path = "crates/rg-primitives" }
