[workspace]
resolver = "2"
members = [
  "crates/rg-primitives",
  "crates/rg-keys",
  "crates/rg-notes",
  "crates/rg-tree",
  "crates/rg-sync",
  "crates/rg-wallet",
  "crates/rg-prover",
  "crates/rg-tx",
  "crates/rg-poi",
  "crates/rg-core",
]

[workspace.package]
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
aes = "0.8"
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
ark-ed-on-bn254 = { version = "0.5", default-features = false }
ctr = "0.9"
curve25519-dalek = "4"
ark-bn254 = { version = "0.5", default-features = false, features = ["curve"] }
ark-ff = { version = "0.5", default-features = false }
bech32 = "0.11"
bip39 = { version = "2", features = ["unicode-normalization"] }
ed25519-dalek = "2"
hex = "0.4"
hmac = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tiny-keccak = { version = "2", features = ["keccak"] }
rg-primitives = { path = "crates/rg-primitives" }
rg-keys = { path = "crates/rg-keys" }
rg-notes = { path = "crates/rg-notes" }
rg-tree = { path = "crates/rg-tree" }
rg-sync = { path = "crates/rg-sync" }
alloy-primitives = { version = "1", default-features = false, features = ["std", "serde"] }
brotli = "8"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
alloy-sol-types = { version = "1", default-features = false, features = ["std"] }
ark-ec = { version = "0.5", default-features = false }
ark-groth16 = { version = "0.5", default-features = false }
ark-poly = { version = "0.5", default-features = false }
ark-relations = { version = "0.5", default-features = false }
ark-serialize = { version = "0.5", default-features = false }
ark-std = { version = "0.5", default-features = false }
rand = "0.8"
rayon = "1"
wasmi = "2"
wasmtime = { version = "50", default-features = false, features = ["cranelift", "runtime", "std"] }
rg-wallet = { path = "crates/rg-wallet" }
rg-poi = { path = "crates/rg-poi" }
rg-tx = { path = "crates/rg-tx" }
rg-prover = { path = "crates/rg-prover", default-features = false }
