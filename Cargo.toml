[workspace]
resolver = "2"
members = [
  "crates/rg-primitives",
  "crates/rg-keys",
  "crates/rg-notes",
  "crates/rg-tree",
  "crates/rg-sync",
  "crates/rg-wallet",
  "crates/rg-prover",
  "crates/rg-tx",
  "crates/rg-poi",
  "crates/rg-broadcaster",
  "crates/rg-core",
  "crates/rg-uniffi",
]

[workspace.package]
edition = "2024"
rust-version = "1.97.1"
license = "Apache-2.0"
repository = "https://github.com/hewigovens/railgun.rs"
publish = true

[workspace.dependencies]
aes = "0.8"
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
alloy-rlp = "0.3"
alloy-primitives = { version = "1", default-features = false, features = ["std", "serde"] }
alloy-sol-types = { version = "1", default-features = false, features = ["std"] }
ark-bn254 = { version = "0.5", default-features = false, features = ["curve"] }
ark-ec = { version = "0.5", default-features = false }
ark-ed-on-bn254 = { version = "0.5", default-features = false }
ark-ff = { version = "0.5", default-features = false }
ark-groth16 = { version = "0.5", default-features = false }
ark-poly = { version = "0.5", default-features = false }
ark-relations = { version = "0.5", default-features = false }
ark-serialize = { version = "0.5", default-features = false }
ark-std = { version = "0.5", default-features = false }
bech32 = "0.11"
bip32 = { version = "0.5", default-features = false, features = ["secp256k1", "alloc"] }
bip39 = { version = "2", features = ["unicode-normalization", "zeroize"] }
brotli = "8"
ctr = "0.9"
curve25519-dalek = "4"
ed25519-dalek = "2"
hex = "0.4"
hickory-resolver = { version = "0.26", default-features = false, features = ["system-config", "tokio"] }
hmac = "0.12"
k256 = { version = "0.13", default-features = false, features = ["ecdsa", "sha256", "std"] }
libp2p = { version = "0.57", default-features = false, features = ["tokio", "tcp", "noise", "yamux", "request-response", "identify", "macros", "secp256k1"] }
prost = "0.14"
rand = "0.8"
rayon = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rg-broadcaster = { version = "0.1.0", path = "crates/rg-broadcaster" }
rg-core = { version = "0.1.0", path = "crates/rg-core" }
rg-keys = { version = "0.1.0", path = "crates/rg-keys" }
rg-notes = { version = "0.1.0", path = "crates/rg-notes" }
rg-poi = { version = "0.1.0", path = "crates/rg-poi" }
rg-primitives = { version = "0.1.0", path = "crates/rg-primitives" }
rg-prover = { version = "0.1.0", path = "crates/rg-prover", default-features = false }
rg-sync = { version = "0.1.0", path = "crates/rg-sync" }
rg-tree = { version = "0.1.0", path = "crates/rg-tree" }
rg-tx = { version = "0.1.0", path = "crates/rg-tx" }
rg-wallet = { version = "0.1.0", path = "crates/rg-wallet" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", default-features = false, features = ["rt", "time"] }
tiny-keccak = { version = "2", features = ["keccak"] }
unicode-normalization = "0.1"
uniffi = { version = "0.32", default-features = false }
wasmi = "2"
wasmtime = { version = "50", default-features = false, features = ["cranelift", "runtime", "std"] }
zeroize = { version = "1", features = ["derive"] }

[workspace.lints.clippy]
too_many_lines = "warn"
